name: Update animated profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_profile_art.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate animated SVG assets
        run: python scripts/generate_profile_art.py
      - name: Commit generated assets
        run: |
          if [[ -n "$(git status --porcelain assets/avi-ascii.svg assets/info-card.svg assets/contrib-heatmap.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/avi-ascii.svg assets/info-card.svg assets/contrib-heatmap.svg
            git commit -m "chore: refresh animated profile art [skip ci]"
            git push
          else
            echo "No generated asset changes."
          fi
